<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有理数侦探局</title>
<style>
:root {
  --ink: #202735;
  --muted: #667085;
  --paper: #fffdf8;
  --cream: #f6f0e5;
  --line: #e8dfd2;
  --blue: #2f6fed;
  --blue-soft: #eaf1ff;
  --orange: #e87938;
  --orange-soft: #fff0e5;
  --green: #1c8a62;
  --green-soft: #e8f7f0;
  --red: #c5484d;
  --red-soft: #fff0f0;
  --shadow: 0 12px 35px rgba(44, 34, 20, .08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--cream);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button { font: inherit; }
.shell { max-width: 960px; margin: 0 auto; padding: 22px 18px 40px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 11px; }
.badge { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--ink); color: white; font-size: 21px; }
.brand h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.statline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.score { color: var(--orange); font-weight: 800; }
.progress { height: 7px; border-radius: 99px; background: #e8e0d6; overflow: hidden; margin-bottom: 19px; }
.progress span { display: block; height: 100%; width: 0; background: var(--blue); transition: width .35s ease; }
.layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 18px; align-items: start; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.game { padding: 25px; min-height: 560px; }
.side { padding: 20px; }
.eyebrow { margin: 0 0 7px; color: var(--blue); font-weight: 800; font-size: 13px; letter-spacing: .03em; }
h2 { margin: 0 0 8px; font-size: 27px; line-height: 1.2; }
.prompt { margin: 0; color: var(--muted); line-height: 1.65; }
.expression { margin: 26px 0 20px; padding: 20px 14px; border-radius: 14px; background: var(--blue-soft); text-align: center; font-size: clamp(27px, 5vw, 42px); font-weight: 800; letter-spacing: 0; overflow-wrap: anywhere; }
.question-label { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { min-height: 58px; border: 1px solid #d7e0f2; border-radius: 12px; background: white; color: var(--ink); padding: 10px 12px; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, background .15s; }
.choice:hover { transform: translateY(-2px); border-color: var(--blue); background: #f8fbff; }
.choice:disabled { cursor: default; transform: none; }
.choice.correct { border-color: var(--green); background: var(--green-soft); color: #116447; }
.choice.wrong { border-color: var(--red); background: var(--red-soft); color: #9b3036; }
.choice .letter { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 7px; border-radius: 7px; background: #eff2f6; color: var(--muted); font-size: 12px; font-weight: 800; }
.feedback { display: none; margin-top: 17px; padding: 13px 14px; border-radius: 12px; line-height: 1.55; font-size: 14px; }
.feedback.show { display: block; }
.feedback.good { background: var(--green-soft); color: #126849; }
.feedback.bad { background: var(--red-soft); color: #8c3035; }
.next { display: none; width: 100%; margin-top: 14px; border: 0; border-radius: 11px; padding: 13px; color: white; background: var(--ink); cursor: pointer; font-weight: 800; }
.next.show { display: block; }
.next:hover { background: #343c4b; }
.side h3 { margin: 0 0 14px; font-size: 17px; }
.mission { display: grid; gap: 9px; margin-bottom: 22px; }
.mission button { border: 1px solid var(--line); border-radius: 12px; background: white; padding: 12px; text-align: left; cursor: pointer; color: var(--ink); }
.mission button.active { border-color: var(--blue); background: var(--blue-soft); }
.mission button.done { border-color: #a9d9c5; background: var(--green-soft); }
.mission strong { display: block; font-size: 14px; }
.mission small { display: block; color: var(--muted); margin-top: 3px; }
.rule { border-top: 1px solid var(--line); padding-top: 17px; }
.rule p { margin: 8px 0; padding: 9px 10px; border-radius: 9px; background: #faf6ef; font-size: 14px; }
.rule b { color: var(--orange); }
.small-note { color: var(--muted); font-size: 12px; line-height: 1.6; }
.restart { margin-top: 18px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 9px; padding: 8px 10px; cursor: pointer; font-size: 12px; }
.finish { display: none; text-align: center; padding-top: 68px; }
.finish.show { display: block; }
.finish .trophy { font-size: 58px; margin-bottom: 10px; }
.finish h2 { font-size: 32px; }
.finish p { color: var(--muted); line-height: 1.7; }
.hidden { display: none !important; }
@media (max-width: 740px) {
  .shell { padding: 16px 13px 30px; }
  .layout { grid-template-columns: 1fr; }
  .side { order: -1; }
  .game { min-height: 500px; padding: 20px 16px; }
  .side { padding: 16px; }
  .mission { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mission button { padding: 9px 7px; }
  .mission small { display: none; }
  .mission strong { font-size: 12px; }
  .topbar { align-items: flex-start; }
  .statline { display: block; text-align: right; line-height: 1.7; }
}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="badge">⌁</div>
      <div><h1>有理数侦探局</h1><p>秋辰的四关小任务</p></div>
    </div>
    <div class="statline">连对 <span id="streak">0</span> 题　<span class="score">得分 <span id="score">0</span></span></div>
  </header>
  <div class="progress"><span id="progressBar"></span></div>
  <div class="layout">
    <section class="panel game">
      <div id="questionView">
        <p class="eyebrow" id="stageLabel">第 1 关 · 看顺序</p>
        <h2 id="title">先找最先动手的地方</h2>
        <p class="prompt" id="prompt">侦探不急着算答案，先判断第一步应该做什么。</p>
        <div class="expression" id="expression"></div>
        <p class="question-label" id="questionLabel">第一步应该是：</p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="nextBtn">下一题</button>
      </div>
      <div class="finish" id="finishView">
        <div class="trophy">🏁</div>
        <h2>案件全部破解</h2>
        <p id="finishText"></p>
        <button class="next show" id="againBtn">再来一轮</button>
      </div>
    </section>
    <aside class="panel side">
      <h3>案件进度</h3>
      <div class="mission" id="missions">
        <button data-stage="0" class="active"><strong>① 看顺序</strong><small>括号先动手</small></button>
        <button data-stage="1"><strong>② 翻转器</strong><small>减号变相反数</small></button>
        <button data-stage="2"><strong>③ 算方向</strong><small>正负数加减</small></button>
        <button data-stage="3"><strong>④ 综合案</strong><small>四步完成</small></button>
      </div>
      <div class="rule">
        <h3>侦探口袋卡</h3>
        <p><b>1</b> 先看括号，最里面的先算。</p>
        <p><b>2</b> 减去一个数 = 加上它的相反数。</p>
        <p><b>3</b> 最后才算正负数。</p>
        <p class="small-note">今天不碰乘除，只练这三件事。每题答完会告诉你哪一步在起作用。</p>
      </div>
      <button class="restart" id="restartBtn">重新开始</button>
    </aside>
  </div>
</main>
<script>
const stages = [
  {
    label: '第 1 关 · 看顺序', title: '先找最先动手的地方', prompt: '侦探不急着算答案，先判断第一步应该做什么。', question: '第一步应该是：',
    items: [
      { expr: '3 - (8 - 5)', options: ['先算 3 - 8', '先算括号里的 8 - 5', '先把 3 变成 -3'], answer: 1, why: '括号里的计算要先处理，外面的减号先不要动。' },
      { expr: '5 + (−2 + 7)', options: ['先算括号里的 −2 + 7', '先算 5 + −2', '先把所有负号删掉'], answer: 0, why: '先处理最里面的括号，其他部分暂时保留。' },
      { expr: '2 − (6 − 9) + 4', options: ['先算 2 − 6', '先算括号里的 6 − 9', '先算最后的 + 4'], answer: 1, why: '看到括号就先看括号里面，不能跳到外面。' }
    ]
  },
  {
    label: '第 2 关 · 翻转器', title: '减号会把方向翻过来', prompt: '减号后面跟着一个带符号的数时，先把它变成“加相反数”。', question: '哪个改写是正确的：',
    items: [
      { expr: '3 − (−5)', options: ['3 + (−5)', '3 + (+5)', '−3 + (−5)'], answer: 1, why: '减去负 5，就是加上正 5。减号像一个翻转器。' },
      { expr: '7 − (+2)', options: ['7 + (−2)', '7 + (+2)', '−7 + (+2)'], answer: 0, why: '减去正 2，就是加上负 2。' },
      { expr: '−4 − (−3)', options: ['−4 + (+3)', '−4 + (−3)', '+4 + (+3)'], answer: 0, why: '括号里的 −3 变成相反数 +3，前面的 −4 不变。' }
    ]
  },
  {
    label: '第 3 关 · 算方向', title: '先看谁离 0 更远', prompt: '异号相加时，绝对值更大的那个数决定最后的正负号。', question: '答案是多少：',
    items: [
      { expr: '(+2,5) + (−7,2)', options: ['+4,7', '−4,7', '−9,7'], answer: 1, why: '7.2 离 0 更远，所以答案取负；7.2 − 2.5 = 4.7。' },
      { expr: '(−6,3) + (+9,8)', options: ['−3,5', '+3,5', '+16,1'], answer: 1, why: '9.8 离 0 更远，所以答案取正；9.8 − 6.3 = 3.5。' },
      { expr: '(−3) + (−4)', options: ['+7', '−1', '−7'], answer: 2, why: '同号都为负，保留负号，再把 3 + 4 = 7。' }
    ]
  },
  {
    label: '第 4 关 · 综合案', title: '四步破案', prompt: '现在把流程连起来：括号、翻转、正负，按顺序来。', question: '最后结果是多少：',
    items: [
      { expr: '3,1 − (24 − 8,4) + (7,5 − 11,2)', options: ['−16,2', '+16,2', '−1,0', '+4,6'], answer: 0, why: '括号先算成 +15.6 和 −3.7，再变成 3.1 − 15.6 − 3.7，结果是 −16.2。' },
      { expr: '(+3) + (−4,5) − (+7,4) + (−6) − (−3,5) + (+7,4)', options: ['−4', '+4', '−11,4', '+7,4'], answer: 0, why: '先把减法改成加相反数，+7.4 和 −7.4 抵消，最后得到 −4。' },
      { expr: '5 − (−2 + 6)', options: ['+9', '+1', '−1', '−9'], answer: 1, why: '括号先算成 +4，再算 5 − 4 = +1。' }
    ]
  }
];
let stageIndex = 0;
let questionIndex = 0;
let score = 0;
let streak = 0;
let answered = false;
const $ = id => document.getElementById(id);
const totalQuestions = stages.reduce((n, s) => n + s.items.length, 0);
function fmt(text) { return text.replaceAll('−', '−'); }
function updateProgress() {
  const done = stageIndex * 3 + questionIndex;
  $('progressBar').style.width = Math.round(done / totalQuestions * 100) + '%';
  $('score').textContent = score;
  $('streak').textContent = streak;
  document.querySelectorAll('#missions button').forEach((b, i) => {
    b.classList.toggle('active', i === stageIndex);
    b.classList.toggle('done', i < stageIndex);
  });
}
function render() {
  answered = false;
  const stage = stages[stageIndex];
  const item = stage.items[questionIndex];
  $('questionView').classList.remove('hidden');
  $('finishView').classList.remove('show');
  $('stageLabel').textContent = stage.label;
  $('title').textContent = stage.title;
  $('prompt').textContent = stage.prompt;
  $('expression').textContent = fmt(item.expr);
  $('questionLabel').textContent = stage.question;
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextBtn').classList.remove('show');
  const choices = $('choices');
  choices.innerHTML = '';
  item.options.forEach((option, index) => {
    const button = document.createElement('button');
    button.className = 'choice';
    button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span>${fmt(option)}`;
    button.addEventListener('click', () => answer(index));
    choices.appendChild(button);
  });
  updateProgress();
}
function answer(index) {
  if (answered) return;
  answered = true;
  const stage = stages[stageIndex];
  const item = stage.items[questionIndex];
  const buttons = [...document.querySelectorAll('.choice')];
  buttons.forEach(b => b.disabled = true);
  buttons[item.answer].classList.add('correct');
  const feedback = $('feedback');
  if (index === item.answer) {
    score += 10 + streak * 2;
    streak += 1;
    feedback.className = 'feedback show good';
    feedback.innerHTML = `<strong>判断正确。</strong> ${item.why}`;
  } else {
    streak = 0;
    buttons[index].classList.add('wrong');
    feedback.className = 'feedback show bad';
    feedback.innerHTML = `<strong>这一步先停一下。</strong> 正确答案是「${fmt(item.options[item.answer])}」。${item.why}`;
  }
  $('nextBtn').classList.add('show');
  updateProgress();
}
function next() {
  questionIndex += 1;
  if (questionIndex >= stages[stageIndex].items.length) {
    stageIndex += 1;
    questionIndex = 0;
  }
  if (stageIndex >= stages.length) finish(); else render();
}
function finish() {
  $('questionView').classList.add('hidden');
  $('finishView').classList.add('show');
  $('finishText').textContent = `本轮得分 ${score} 分。记住三张口袋卡：括号先算，减号翻转，最后算正负。你可以再来一轮，把刚才错的题追回来。`;
  $('progressBar').style.width = '100%';
  document.querySelectorAll('#missions button').forEach(b => { b.classList.remove('active'); b.classList.add('done'); });
}
function restart() { stageIndex = 0; questionIndex = 0; score = 0; streak = 0; render(); }
$('nextBtn').addEventListener('click', next);
$('againBtn').addEventListener('click', restart);
$('restartBtn').addEventListener('click', restart);
document.querySelectorAll('#missions button').forEach(button => {
  button.addEventListener('click', () => {
    const target = Number(button.dataset.stage);
    if (target <= stageIndex) { stageIndex = target; questionIndex = 0; render(); }
  });
});
render();
</script>
</body>
</html>
